name: CI
on: [push]
env:
  APP_NAME: fastapi-starter

jobs:
  lint:
    name: Lint – Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Vérifier le style
        run: ruff check .
      - name: Installer les dépendances
        run: pip install fastapi pydantic -r requirements-dev.txt

  build:
    name: Build – Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Compiler le code
        run: python -m compileall app
      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"
      - name: Installer les dépendances
        run: pip install fastapi pydantic -r requirements-dev.txt
  test:
    name: Test – Pytest
    needs: [ lint, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Afficher les contextes
        run: |
          echo "App: ${{ env.APP_NAME }}"
          echo "Acteur: ${{ github.actor }}"
          echo "Evénement: ${{ github.event_name }}"
          echo "Branche: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "OS: ${{ runner.os }}"
      - name: Afficher tout le contexte GitHub
        run: echo '${{ toJson(github) }}'
      - name: Exécuter Pytest
        run: pytest
      - name: Installer les dépendances
        run: pip install fastapi pydantic -r requirements-dev.txt
